<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Camera</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <h1>Live Camera</h1>
    <div class="status" id="status">
      <span class="status-dot"></span>
      <span class="status-text">Connecting...</span>
    </div>
  </header>

  <main>
    <section class="viewer" id="viewer">
      <img id="stream" src="{{ url_for('video_feed') }}" alt="Live camera feed">
    </section>

    <div class="controls">
      <a class="button" href="{{ url_for('snapshot') }}" download="snapshot.jpg">Save snapshot</a>
      <button class="button" type="button" id="fullscreen">Full screen</button>
    </div>
  </main>

  <footer class="site-footer">
    <span id="details"></span>
  </footer>

  <script>
    const statusEl = document.getElementById("status");
    const statusText = statusEl.querySelector(".status-text");
    const details = document.getElementById("details");
    const stream = document.getElementById("stream");
    const viewer = document.getElementById("viewer");

    async function refreshStatus() {
      try {
        const res = await fetch("{{ url_for('status') }}", { cache: "no-store" });
        const data = await res.json();
        statusEl.dataset.state = data.connected ? "live" : "offline";
        statusText.textContent = data.connected ? "Live" : "Camera offline";
        details.textContent = data.connected
          ? `${data.width}×${data.height} · ${data.fps} fps`
          : "Waiting for camera...";
      } catch {
        statusEl.dataset.state = "offline";
        statusText.textContent = "Server unreachable";
        details.textContent = "";
      }
    }
    refreshStatus();
    setInterval(refreshStatus, 3000);

    // If the stream connection drops (e.g. the Pi restarts), reconnect it
    stream.addEventListener("error", () => {
      setTimeout(() => {
        stream.src = "{{ url_for('video_feed') }}?t=" + Date.now();
      }, 2000);
    });

    document.getElementById("fullscreen").addEventListener("click", () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (viewer.requestFullscreen) {
        viewer.requestFullscreen();
      }
    });
  </script>
</body>
</html>
