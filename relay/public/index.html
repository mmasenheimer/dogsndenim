<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dogs n Denim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rain" id="rain" aria-hidden="true"></div>

  <header class="site-header">
    <h1>Dogs n Denim</h1>
    <p class="tagline">We hosted a website and Wi-Fi... on a dog... for a dog fashion show.</p>
  </header>

  <main>
    <section class="viewer">
      <img id="stream" alt="Live camera feed">
      <p class="viewer-message" id="message">Connecting...</p>
    </section>
  </main>

  <footer class="site-footer">
    <span id="details"></span>
    <span class="credit">Brought to you by <strong>CATalyst Studios</strong></span>
  </footer>

  <script>
    const stream = document.getElementById("stream");
    const message = document.getElementById("message");
    const details = document.getElementById("details");
    const rain = document.getElementById("rain");

    // The browser acknowledges frames in batches so the relay knows how far behind we are
    const ACK_EVERY = 5;
    let socket = null;
    let status = { live: false, viewers: 0 };
    let framesThisSecond = 0;
    let fps = 0;

    function showMessage(text) {
      message.textContent = text;
      message.hidden = !text;
    }

    function updateDetails() {
      if (!status.live) {
        details.textContent = "";
        return;
      }
      const watching = `${status.viewers} watching`;
      details.textContent = fps ? `${watching} · ${fps} fps` : watching;
    }

    // Dogs fall behind the page while the visitor is connected
    let rainTimer = null;

    function dropDog() {
      const dog = document.createElement("img");
      dog.src = "dog.jpg";
      dog.alt = "";
      const size = 40 + Math.random() * 50;
      dog.style.width = dog.style.height = `${size}px`;
      dog.style.left = `${Math.random() * 100}vw`;
      dog.style.animationDuration = `${5 + Math.random() * 5}s`;
      dog.style.setProperty("--spin", `${Math.random() * 720 - 360}deg`);
      dog.addEventListener("animationend", () => dog.remove());
      rain.append(dog);
    }

    function startRain() {
      if (rainTimer || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      rainTimer = setInterval(dropDog, 400);
    }

    function stopRain() {
      clearInterval(rainTimer);
      rainTimer = null;
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.binaryType = "blob";
      let received = 0;

      socket.addEventListener("open", startRain);

      socket.addEventListener("message", (event) => {
        if (typeof event.data === "string") {
          status = JSON.parse(event.data);
          if (!status.live) showMessage("The camera is offline. It'll be back soon!");
          updateDetails();
          return;
        }
        const previous = stream.src;
        stream.src = URL.createObjectURL(event.data);
        if (previous) URL.revokeObjectURL(previous);
        showMessage("");
        framesThisSecond += 1;
        received += 1;
        if (received % ACK_EVERY === 0) socket.send(String(ACK_EVERY));
      });

      socket.addEventListener("close", () => {
        socket = null;
        stopRain();
        if (document.hidden) return;
        showMessage("Reconnecting...");
        setTimeout(connect, 2000);
      });
    }

    setInterval(() => {
      fps = framesThisSecond;
      framesThisSecond = 0;
      updateDetails();
    }, 1000);

    // Stop downloading video while the tab is in the background to save the viewer's data
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        socket?.close();
      } else if (!socket) {
        connect();
      }
    });

    connect();
  </script>
</body>
</html>
